<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>نجوم أكتوبر — v3</title>
<style>
  @font-face { font-family:'Cairo';  src:url('fonts/Cairo.ttf') format('truetype'); font-weight:100 1000; font-display:block; }
  @font-face { font-family:'TajB';   src:url('fonts/Tajawal-Black.ttf') format('truetype'); font-weight:900; font-display:block; }
  @font-face { font-family:'Rakkas'; src:url('fonts/Rakkas.ttf') format('truetype'); font-weight:400; font-display:block; }
  @font-face { font-family:'Kufi';   src:url('fonts/NotoKufi.ttf') format('truetype'); font-weight:100 900; font-display:block; }
  @font-face { font-family:'PlexB';  src:url('fonts/IBMPlexSansArabic-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
  html,body { margin:0; background:#04060F; } canvas { display:block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="lib/core3.js"></script>
<script src="lib/kt.js"></script>
<script src="lib/kit_oct7.js"></script>
<script src="data/students.js"></script>
<script src="scenes/p1v2.js"></script>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  const RS=parseFloat(q.get('rs')||'1');
  const cv=document.getElementById('cv');
  cv.width=Math.round(1080*RS); cv.height=Math.round(1920*RS);
  const ctx=cv.getContext('2d');
  window.Scenes={ p1v2:(t)=>window.Core3.drawFrame(ctx,t) };
  window.seek=function(t){
    ctx.setTransform(RS,0,0,RS,0,0);
    window.Core3.drawFrame(ctx,t);
  };
  const manifest={
    emblem:'assets/gen/emblem_gold.jpg', library:'assets/gen/library_hall.jpg',
    pedestal:'assets/gen/hall_pedestal.jpg', skyhero:'assets/gen/sky_hero.jpg',
    moon:'assets/gen/moon_night.jpg', laurel:'assets/gen/laurel.jpg', crown:'assets/gen/crown_gold.jpg',
    laurelA:'assets/gen/laurel_a.png', crownA:'assets/gen/crown_gold_a.png',
    logo:'assets/logo/October_7_School_Logo.webp',
    mutaz:'assets/plates/mutaz.png', moyed:'assets/plates/moyed.png',
    saad:'assets/plates/saad.png', anhar:'assets/plates/anhar.png',
    shouq:'assets/plates/shouq.png', anas:'assets/plates/anas.png', shomookh:'assets/plates/shomookh.png'
  };
  (async()=>{
    const jobs=Object.entries(manifest).map(([k,src])=>window.Core3.loadImg(k,src));
    jobs.push(document.fonts.load('1000 130px Cairo','نجوم ١'));
    jobs.push(document.fonts.load('900 90px TajB','معتز'));
    jobs.push(document.fonts.load('400 90px Rakkas','رحاب'));
    jobs.push(document.fonts.load('700 60px Kufi','سبعة أكتوبر'));
    jobs.push(document.fonts.ready);
    await Promise.all(jobs);
    await window.Core3.init(1080,1920);
    ctx.setTransform(RS,0,0,RS,0,0);
    window.Core3.drawFrame(ctx,0);
    window.READY=true;
  })();
})();
</script>
</body>
</html>
